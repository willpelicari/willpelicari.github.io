<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Página não encontrada</title>
    <script>
      // Mapa do Boi moved to its own subdomain. Its old pages redirect on their own; any other /mapadoboi/ path (the
      // web app's routes, under /mapadoboi/app/) goes to the same path there, where the app's own 404 page takes over.
      (function (l) {
        var base = '/mapadoboi/';
        if (l.pathname.indexOf(base) !== 0 && l.pathname !== '/mapadoboi') return;
        l.replace('https://mapadoboi.wiltonpelicari.com/' + l.pathname.slice(base.length) + l.search + l.hash);
      })(location);
    </script>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-content: center; gap: 8px; padding: 16px; text-align: center; font-family: system-ui, sans-serif; }
      h1 { margin: 0; font-size: 22px; }
    </style>
  </head>
  <body>
    <h1>Página não encontrada</h1>
    <a href="/">wiltonpelicari.com</a>
  </body>
</html>
